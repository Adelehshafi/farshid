<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6b63">
<title>Farshid</title>
<meta name="description" content="Farshid: discover Tehran's best restaurants, cafés and local services with real reviews, live opening hours and a city map.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400..900&family=Plus+Jakarta+Sans:wght@400..800&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  (function () {
    var l = 'fa', th = null;
    try { var p = JSON.parse(localStorage.getItem('farshid-prefs') || '{}'); if (p.lang === 'en') l = 'en'; if (p.theme === 'dark' || p.theme === 'light') th = p.theme; } catch (e) { /* storage blocked */ }
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
    if (th) document.documentElement.setAttribute('data-theme', th);
  })();
</script>
<style>html,body{margin:0}img{max-width:100%}</style>
</head>
<body>
<button type="button" class="skip" data-action="skip">Skip to content</button>
<div id="toastHost" aria-live="polite"></div>
<header id="siteHeader" class="site-header"></header>
<main id="app"></main>
<footer id="siteFooter" class="site-footer"></footer>
<nav id="bottomNav" class="bottom-nav" aria-label="Main"></nav>
<div id="modalRoot"></div>
<noscript><p style="padding:24px;text-align:center">Farshid needs JavaScript to run.</p></noscript>
<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="art.js"></script>
<script src="geo.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
